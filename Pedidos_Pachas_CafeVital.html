<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pedidos Pachas y Café Vital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1B19;--bg:#F4F1EC;--card:#FFFFFF;--line:#DDD6CC;--muted:#5A534E;--red:#C1121F;--pachas:#C2410C;--cafe:#6F4E37;--acc:var(--red)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body.pachas{--acc:var(--pachas)} body.cafe{--acc:var(--cafe)}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:5px solid var(--acc)}
header img{height:40px}
header .t{font-family:Oswald,sans-serif;font-weight:700;font-size:20px;letter-spacing:.5px;flex:1}
.back{background:transparent;border:1.5px solid #fff6;color:#fff;border-radius:10px;padding:8px 12px;font:600 14px Inter,sans-serif}
main{flex:1;padding:16px 16px 120px}
h2{font-family:Oswald,sans-serif;font-weight:500;font-size:20px;letter-spacing:1px;margin:8px 0 12px;text-transform:uppercase}
.home{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.home .logo{display:block;margin:8px auto 4px;width:180px}
.big{border:none;border-radius:18px;padding:28px 20px;color:#fff;text-align:left;font-family:Oswald,sans-serif;font-size:30px;font-weight:700;letter-spacing:.5px;display:flex;flex-direction:column;gap:4px}
.big small{font-family:Inter,sans-serif;font-size:14px;font-weight:600;opacity:.9;letter-spacing:0}
.big.p{background:var(--pachas)} .big.c{background:var(--cafe)}
.cat{margin-bottom:18px}
.cat h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;font:600 15px Inter,sans-serif;color:var(--ink);text-align:left;min-height:56px}
.item:active{border-color:var(--acc)}
.opt{margin-bottom:18px}
.opt .lbl{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.req{font-size:11px;color:#fff;background:var(--acc);border-radius:6px;padding:2px 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;font:600 15px Inter,sans-serif;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:700 26px Inter,sans-serif;color:var(--ink)}
.qty span{font:700 28px Inter,sans-serif;min-width:40px;text-align:center}
input[type=text],input[type=number]{width:100%;font:600 18px Inter,sans-serif;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar .in{max-width:488px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.cta{width:100%;border:none;border-radius:14px;padding:17px;background:var(--acc);color:#fff;font:700 17px Inter,sans-serif;text-align:center;text-decoration:none;display:block}
.cta.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.cta:disabled{opacity:.4}
.cart{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:16px}
.cart .row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:14px}
.cart .row:last-child{border-bottom:none}
.cart .row span{flex:1}
.x{border:none;background:#F4F1EC;border-radius:8px;width:34px;height:34px;font:700 16px Inter,sans-serif;color:var(--muted)}
.msg{background:#E7F8DC;border:1.5px solid #B9E3A0;border-radius:14px;padding:16px;font:500 15px/1.7 'JetBrains Mono',monospace;white-space:pre-wrap;margin-bottom:16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.box .k{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;font-weight:700}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:4px 0 0}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9;display:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
</style>
</head>

const LUGARES=['PC','Consola','Streaming','Simulador','Recepción','Sala de estar'];
const SIN_NUM=['Recepción','Sala de estar'];
const CAMBIOS=['10','20','50','100','200'];

// ---------- ESTADO ----------
let S;
function reset(){S={view:'home',local:null,cart:[],cur:null,lugar:null,num:'',pago:null,cambio:'',turno:turnoAuto(),n:1};}
function turnoAuto(){const h=new Date().getHours();return (h>=15||h<7)?'TARDE':'MAÑANA';}
function hoy(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function key(){return 'pedidos:'+S.local+':'+hoy()+':'+S.turno;}
function lastN(){try{return parseInt(localStorage.getItem(key())||'0',10)||0}catch(e){return 0}}
function saveN(n){try{localStorage.setItem(key(),String(n))}catch(e){}}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800);}

function lineOf(it){
  const m=it.item; let s=it.q+' '+(it.q>1?m.p:m.s);
  m.o.forEach(o=>{if(it.sel[o.k])s+=' '+it.sel[o.k];});
  m.tg.forEach(t=>{if(it.tg[t.l])s+=t.t;});
  if(it.nota.trim())s+=', '+it.nota.trim();
  return s;
}
function pagoTxt(){return S.pago==='QR'?'QR':S.pago==='Justo'?'Justo':'Cambio de '+S.cambio;}
function lugarTxt(){return SIN_NUM.includes(S.lugar)?S.lugar:S.lugar+' '+S.num;}
function mensaje(){
  const L=MENU[S.local].short;
  return [L+' - '+S.turno+' - N° '+S.n, lugarTxt(), ...S.cart.map(lineOf), 'Pago: '+pagoTxt()].join('\n');
}

// ---------- NAVEGACIÓN ----------
const BACK={menu:'home',item:'menu',lugar:'menu',pago:'lugar',fin:'pago'};
function go(v){S.view=v;render();window.scrollTo(0,0);}
$('back').onclick=()=>{ if(S.view==='menu'&&S.cart.length&&!confirmBox()) return; go(BACK[S.view]||'home'); };
function confirmBox(){ if(confirmBox.ok){confirmBox.ok=false;return true;} confirmBox.ok=true; toast('Toca Atrás otra vez para descartar el pedido'); setTimeout(()=>confirmBox.ok=false,2500); return false; }

function render(){
  document.body.className=S.local||'';
  $('back').style.display=S.view==='home'?'none':'block';
  $('title').textContent=S.local?MENU[S.local].name:'PEDIDOS';
  const m=$('main'), b=$('barIn'); b.innerHTML='';
  ({home,menu,item,lugar,pago,fin})[S.view](m,b);
  m.style.paddingBottom=($('bar').offsetHeight+24)+'px';
}

function home(m){
  m.innerHTML=`<div class="home">
    <img class="logo" src="${document.querySelector('header img').src}" alt="">
    <h2 style="text-align:center;margin:0 0 4px">Realizar pedido</h2>
    <button class="big p" id="gp">POLLOS PACHAS<small>Broaster, cuellitos, alitas, pipocas…</small></button>
    <button class="big c" id="gc">CAFÉ VITAL<small>Sándwiches, hamburguesas, café, frappé…</small></button>
    <p class="hint" style="text-align:center">Turno actual: <b>${turnoAuto()}</b> (mañana 7:00–15:00 · tarde 15:00–23:00)</p></div>`;
  $('gp').onclick=()=>{S.local='pachas';S.cart=[];go('menu');};
  $('gc').onclick=()=>{S.local='cafe';S.cart=[];go('menu');};
}

function cartHtml(edit){
  if(!S.cart.length) return '<div class="cart"><div class="empty">Todavía no agregaste productos.</div></div>';
  return '<div class="cart">'+S.cart.map((it,i)=>`<div class="row"><span>${esc(lineOf(it))}</span>${edit?`<button class="x" data-del="${i}" aria-label="Quitar">✕</button>`:''}</div>`).join('')+'</div>';
}
function bindDel(){document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{S.cart.splice(+x.dataset.del,1);render();});}

function menu(m,b){
  let h='';
  if(S.cart.length) h+='<h2>Tu pedido</h2>'+cartHtml(true);
  h+='<h2>'+(S.cart.length?'Agregar otro producto':'¿Qué va a pedir?')+'</h2>';
  MENU[S.local].cats.forEach((c,ci)=>{
    h+=`<div class="cat"><h3>${c[0]}</h3><div class="grid">`+c[1].map((it,ii)=>`<button class="item" data-c="${ci}" data-i="${ii}">${esc(it.s)}</button>`).join('')+'</div></div>';
  });
  m.innerHTML=h; bindDel();
  document.querySelectorAll('.item').forEach(x=>x.onclick=()=>{
    const it=MENU[S.local].cats[x.dataset.c][1][x.dataset.i];
    S.cur={item:it,q:1,sel:{},tg:{},nota:''}; go('item');
  });
  b.innerHTML=`<button class="cta" id="next" ${S.cart.length?'':'disabled'}>Continuar (${S.cart.length} producto${S.cart.length===1?'':'s'})</button>`;
  $('next').onclick=()=>go('lugar');
}

function item(m,b){
  const c=S.cur, it=c.item;
  let h=`<h2>${esc(it.s)}</h2>`;
  it.o.forEach(o=>{
    h+=`<div class="opt"><div class="lbl">${o.label}${o.req?'<span class="req">elige uno</span>':''}</div><div class="chips">`+
      o.ch.map(ch=>`<button class="chip ${c.sel[o.k]===ch[1]?'on':''}" data-o="${o.k}" data-v="${esc(ch[1])}">${ch[0]}</button>`).join('')+'</div></div>';
  });
  if(it.tg.length) h+='<div class="opt"><div class="lbl">Extras</div><div class="chips">'+it.tg.map(t=>`<button class="chip ${c.tg[t.l]?'on':''}" data-t="${esc(t.l)}">${t.l}</button>`).join('')+'</div></div>';
  h+=`<div class="opt"><div class="lbl">Cantidad</div><div class="qty"><button id="qm">−</button><span id="qv">${c.q}</span><button id="qp">+</button></div></div>
      <div class="opt"><div class="lbl">Nota (opcional)</div><input type="text" id="nota" placeholder="Ej.: extra llajua, en bolsitas separadas" value="${esc(c.nota)}"></div>
      <p class="hint">Así se verá: <b id="prev" style="font-family:'JetBrains Mono',monospace">${esc(lineOf(c))}</b></p>`;
  m.innerHTML=h;
  const upd=()=>{$('prev').textContent=lineOf(c);$('qv').textContent=c.q;const ok=it.o.every(o=>!o.req||c.sel[o.k]);$('add').disabled=!ok;};
  document.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{c.sel[x.dataset.o]=x.dataset.v;document.querySelectorAll(`[data-o="${x.dataset.o}"]`).forEach(y=>y.classList.toggle('on',y===x));upd();});
  document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{c.tg[x.dataset.t]=!c.tg[x.dataset.t];x.classList.toggle('on');upd();});
  $('qm').onclick=()=>{if(c.q>1)c.q--;upd();}; $('qp').onclick=()=>{c.q++;upd();};
  $('nota').oninput=e=>{c.nota=e.target.value;upd();};
  b.innerHTML='<button class="cta" id="add">Agregar al pedido</button>';
  $('add').onclick=()=>{S.cart.push(c);S.cur=null;toast('Agregado');go('menu');};
  upd();
}

function lugar(m,b){
  m.innerHTML=`<h2>¿Dónde está el cliente?</h2><div class="opt"><div class="chips">`+
    LUGARES.map(l=>`<button class="chip ${S.lugar===l?'on':''}" data-l="${l}">${l}</button>`).join('')+`</div></div>
    <div class="opt" id="numBox" style="display:${S.lugar&&!SIN_NUM.includes(S.lugar)?'block':'none'}"><div class="lbl">Número</div>
    <input type="number" inputmode="numeric" id="num" placeholder="Ej.: 45" value="${esc(S.num)}"></div>`;
  const upd=()=>{$('nx').disabled=!(S.lugar&&(SIN_NUM.includes(S.lugar)||S.num.trim()));};
  document.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{S.lugar=x.dataset.l;document.querySelectorAll('[data-l]').forEach(y=>y.classList.toggle('on',y===x));
    const need=!SIN_NUM.includes(S.lugar);$('numBox').style.display=need?'block':'none';if(need)$('num').focus();upd();});
  $('num').oninput=e=>{S.num=e.target.value;upd();};
  b.innerHTML='<button class="cta" id="nx">Continuar</button>'; $('nx').onclick=()=>go('pago'); upd();
}

function pago(m,b){
  const showC=S.pago==='Cambio';
  m.innerHTML=`<h2>¿Cómo paga?</h2><div class="opt"><div class="chips">`+
    ['QR','Justo','Cambio'].map(p=>`<button class="chip ${S.pago===p?'on':''}" data-p="${p}">${p==='Justo'?'Efectivo justo':p==='Cambio'?'Efectivo con cambio':p}</button>`).join('')+`</div></div>
    <div class="opt" id="cBox" style="display:${showC?'block':'none'}"><div class="lbl">¿Cambio de cuánto? (Bs)</div><div class="chips" style="margin-bottom:10px">`+
    CAMBIOS.map(c=>`<button class="chip ${S.cambio===c?'on':''}" data-c="${c}">${c}</button>`).join('')+`</div>
    <input type="number" inputmode="numeric" id="otro" placeholder="Otro monto" value="${CAMBIOS.includes(S.cambio)?'':esc(S.cambio)}"></div>`;
  const upd=()=>{$('nx').disabled=!(S.pago&&(S.pago!=='Cambio'||S.cambio.trim()));};
  document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{S.pago=x.dataset.p;document.querySelectorAll('[data-p]').forEach(y=>y.classList.toggle('on',y===x));$('cBox').style.display=S.pago==='Cambio'?'block':'none';upd();});
  document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{S.cambio=x.dataset.c;$('otro').value='';document.querySelectorAll('[data-c]').forEach(y=>y.classList.toggle('on',y===x));upd();});
  $('otro').oninput=e=>{S.cambio=e.target.value;document.querySelectorAll('[data-c]').forEach(y=>y.classList.remove('on'));upd();};
  b.innerHTML='<button class="cta" id="nx">Ver pedido</button>';
  $('nx').onclick=()=>{S.turno=turnoAuto();S.n=lastN()+1;go('fin');}; upd();
}

function fin(m,b){
  m.innerHTML=`<h2>Revisa y envía</h2>
   <div class="row2">
     <div class="box"><div class="k">Turno</div><div class="chips">${['MAÑANA','TARDE'].map(t=>`<button class="chip ${S.turno===t?'on':''}" data-tu="${t}">${t==='MAÑANA'?'Mañana':'Tarde'}</button>`).join('')}</div></div>
     <div class="box"><div class="k">N° de pedido</div><div class="qty"><button id="nm" style="width:44px;height:44px">−</button><span id="nv" style="font-size:24px">${S.n}</span><button id="np" style="width:44px;height:44px">+</button></div></div>
   </div>
   <div class="msg" id="msg"></div>
   <p class="hint">Al tocar el botón verde se abre WhatsApp: elige el grupo del local y envía. El N° se ajusta solo según los pedidos que ya enviaste hoy desde este celular; cámbialo si otra persona también envió pedidos.</p>`;
  const upd=()=>{$('msg').textContent=mensaje();$('nv').textContent=S.n;$('wa').href='https://wa.me/?text='+encodeURIComponent(mensaje());};
  document.querySelectorAll('[data-tu]').forEach(x=>x.onclick=()=>{S.turno=x.dataset.tu;S.n=lastN()+1;document.querySelectorAll('[data-tu]').forEach(y=>y.classList.toggle('on',y===x));upd();});
  $('nm').onclick=()=>{if(S.n>1)S.n--;upd();}; $('np').onclick=()=>{S.n++;upd();};
  b.innerHTML=`<a class="cta" id="wa" target="_blank" rel="noopener" style="background:#1FA855">Enviar por WhatsApp</a>
    <button class="cta sec" id="cp">Copiar mensaje</button>
    <button class="cta sec" id="nw">Nuevo pedido</button>`;
  $('wa').onclick=()=>{saveN(S.n);toast('Pedido N° '+S.n+' registrado');};
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(mensaje());saveN(S.n);toast('Mensaje copiado');}catch(e){toast('No se pudo copiar; mantén presionado el texto');}};
  $('nw').onclick=()=>{reset();render();};
  upd();
}

reset(); render();
</script>
</body>
</html>
